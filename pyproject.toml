[project]
name = "file-organiser"
version = "0.1.0"
description = "File organiser and duplicate finder CLI: sorts files by type/date, finds duplicates by content hash, supports --dry-run."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15",
]

[project.scripts]
file-organiser = "file_organiser.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/file_organiser"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
